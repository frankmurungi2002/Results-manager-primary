name: Release

# Builds the Windows installer, signs it for automatic updates and publishes
# it, with latest.json, as a release of the PUBLIC repository
# frankmurungi2002/termbook-releases. Schools download from there; this
# source repository stays private, so nobody can rebuild Termbook without
# its licence check. Runs when a version tag is pushed, e.g. `v1.0.1`.
# Needs the secrets TAURI_SIGNING_PRIVATE_KEY (the whole updater.key file)
# and RELEASES_TOKEN (a token that may write to termbook-releases); see
# docs/UPDATES.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: frankmurungi2002
          repo: termbook-releases
          tagName: ${{ github.ref_name }}
          releaseName: Termbook ${{ github.ref_name }}
          releaseBody: See the changes in this release below.
          releaseDraft: false
          includeUpdaterJson: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
