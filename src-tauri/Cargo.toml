[package]
name = "results-manager"
version = "0.1.0"
description = "Offline-first school management for Ugandan nursery and primary schools"
authors = ["Phantom School Manager"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "results_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage. `bundled` compiles SQLite into the binary so a school PC needs
# no system SQLite. The `encrypted-db` feature below swaps this for SQLCipher.
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "backup", "functions", "hooks"] }

# Password hashing. Argon2id is the current OWASP recommendation.
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
parking_lot = "0.12"
log = "0.4"

# Excel reading for FR-C3 (marks upload) and FR-G13 (onboarding import).
# Done in Rust rather than JS so untrusted spreadsheets are parsed in a
# memory-safe sandbox, never in the webview.
calamine = "0.26"
rust_xlsxwriter = "0.79"

# HTTPS to the SMS gateway (FR-G8), used only at the moment a queued message
# is sent. Blocking and rustls-based: no OpenSSL to build, nothing async.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

# Signatures and the school stamp (photographed on paper) are decoded and
# cleaned in Rust: untrusted image files never reach the webview. PNG and
# JPEG only, pure Rust decoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# SHA-256 for the audit log's hash chain: each entry seals the one before,
# so any change, deletion or insertion outside the application is detectable.
sha2 = "0.10"

# Subscription keys (FR-B11) are Ed25519-signed by the owner and verified
# here, offline. Only verification is compiled in; the private key and the
# issuing tool live outside this crate (tools/phantom-licence).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"

# OS-keychain storage for the database key, used only by `encrypted-db`.
keyring = { version = "3", optional = true }
qrcodegen = "1.8"
tauri-plugin-updater = "2"

[dev-dependencies]
# `tauri::test`'s mock runtime, for examples/ui_bridge.rs: the real commands
# behind a local port, so the interface can be checked in a headless browser.
tauri = { version = "2", features = ["test"] }

[features]
default = []
# Full-database encryption at rest via SQLCipher.
#
# Turning this on requires NASM and Perl on the build machine because
# openssl-src compiles OpenSSL from source. See docs/SECURITY.md.
encrypted-db = ["rusqlite/bundled-sqlcipher-vendored-openssl", "dep:keyring"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
