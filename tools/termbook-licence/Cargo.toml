[package]
name = "termbook-licence"
version = "0.1.0"
edition = "2021"
publish = false
description = "The owner's tool for issuing Termbook licence keys. Never shipped to schools."

# Not part of the application's workspace: it holds no school data, and the
# application never needs it.
[workspace]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
